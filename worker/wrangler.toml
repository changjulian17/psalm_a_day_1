name = "psalm-a-day"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Cron is UTC. 23:00 UTC = 07:00 SGT.
[triggers]
crons = ["0 23 * * *"]

# Secrets (set with `wrangler secret put <NAME>`, never commit them):
#   TELEGRAM_TOKEN  - bot token from @BotFather
#   CHAT_ID         - target chat/group id (groups are negative)
#   ESV_API_KEY     - free key from https://api.esv.org
